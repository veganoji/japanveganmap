<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>D3 並べ替え｜日本ビーガンマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Noto+Sans+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">
<style>
:root{--red:#C9223A;--gold:#D4A847;--paper:#FFF9EE;--ink:#1d1a17}
*{box-sizing:border-box}
body{margin:0;background:#f3eee4;color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
header{max-width:1100px;margin:0 auto;padding:22px 16px 6px}
header h1{font-size:24px;margin:0 0 6px}
header p{margin:3px 0;font-size:16px;line-height:1.6;color:#4a443d}
header a{color:var(--red)}
.wrap{max-width:1100px;margin:0 auto;padding:10px 16px 150px;display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:800px){.wrap{grid-template-columns:1fr}}
.stage{position:sticky;top:10px}
@media (max-width:800px){.stage{position:static}}
.frame{position:relative;width:100%;aspect-ratio:1080/1350;overflow:hidden;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.15);background:#1d1a17}
.art{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0;transform:scale(var(--s,.4));overflow:hidden;font-family:"Noto Sans JP",sans-serif}
.art *{margin:0}
.g{position:absolute;left:0;top:0;width:1080px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:334px;gap:8px}
.slot{background-size:cover;background-position:center;position:relative;cursor:pointer;touch-action:none}
.slot .n{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.65);color:#fff;font:800 40px Inter;border-radius:12px;padding:2px 14px;opacity:0;transition:opacity .15s}
body.edit .slot .n{opacity:1}
.slot.sel{outline:14px solid #ffd54a;outline-offset:-14px}
.slot.over{outline:14px solid #fff;outline-offset:-14px}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,rgba(0,0,0,0) 0%,rgba(0,0,0,.25) 60%,rgba(0,0,0,.55) 100%)}
.top{position:absolute;left:90px;right:90px;top:70px;background:var(--paper);border:6px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:30px;padding:22px 10px 26px;text-align:center;pointer-events:none}
.top p:first-child{font:900 92px/1.1 "Zen Maru Gothic"}
.top p:last-child{font:800 26px Inter;letter-spacing:.34em;color:var(--red);margin-top:6px}
svg.pin{position:absolute;left:360px;top:400px;width:360px;height:486px;overflow:visible;filter:drop-shadow(14px 14px 0 #1d1a17);pointer-events:none}
.face{position:absolute;left:408.6px;top:441.6px;width:262.8px;height:262.8px;border-radius:50%;background:#fff;border:7px solid var(--ink);overflow:hidden;pointer-events:none}
.face img{position:absolute;left:50%;top:13px;width:184px;transform:translateX(-50%)}
.pills{position:absolute;left:0;right:0;top:1150px;display:flex;justify-content:center;gap:16px;pointer-events:none}
.pills span{background:#fff;border:5px solid var(--ink);border-radius:22px;padding:14px 26px;font:900 36px "Zen Maru Gothic";box-shadow:6px 6px 0 var(--ink);white-space:nowrap}
.pills .r{background:var(--red);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:700 15px "Noto Sans JP",sans-serif;padding:11px 14px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.btn.main{background:var(--red);color:#fff}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.hint{font-size:15px;color:#5a534b;margin:10px 2px 0;line-height:1.55}
.tray h2{font-size:18px;margin:0 0 4px}
.tray>p{margin:0 0 10px;font-size:15px;color:#5a534b}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph div{position:relative;aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center;cursor:grab;touch-action:none;border:3px solid transparent}
.ph div.used{opacity:.45}
.ph div b{position:absolute;right:4px;top:4px;background:var(--red);color:#fff;font:800 12px Inter;border-radius:99px;padding:2px 7px}
.ph div i{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font:700 11px Inter;font-style:normal;border-radius:6px;padding:1px 5px}
.ph div.sel{border-color:#ffd54a}
.ghost{position:fixed;width:84px;height:84px;border-radius:12px;background-size:cover;background-position:center;pointer-events:none;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translate(-50%,-50%) rotate(-4deg);border:3px solid #fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5ddcf;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:20;flex-wrap:wrap}
.bar span{font-size:14px;color:#4a443d;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body class="edit">
<header>
  <h1>🧩 D3「4×4グリッド × 中央ピン」並べ替え</h1>
  <p><b>ドラッグ</b>で写真をマスに入れる・マス同士を入れ替える。スマホは<b>マスをタップ → 写真をタップ</b>（マス→マスで入れ替え）。</p>
  <p>真ん中の4マスはピンで一部かくれます。決まったら「この並びで決定」。<a href="/cover-lab/v2/">← ラボ②に戻る</a></p>
</header>
<div class="wrap">
  <section class="stage">
    <div class="frame" id="frame">
      <div class="art" id="art">
        <div class="g" id="grid"></div>
        <div class="vig"></div>
        <div class="top"><p>日本ビーガンマップ</p><p>JAPAN VEGAN MAP · 2027</p></div>
        <svg class="pin" viewBox="0 0 200 270"><path d="M100 6C49 6 10 45 10 96c0 66 78 150 86 160a5 5 0 0 0 8 0c8-10 86-94 86-160C190 45 151 6 100 6z" fill="#C9223A" stroke="#1d1a17" stroke-width="5"/></svg>
        <div class="face"><img src="/images/mascot/map-japan.png" alt="" crossorigin="anonymous"></div>
        <div class="pills"><span class="r">2027年版</span><span>2,300店以上</span><span>47都道府県</span></div>
      </div>
    </div>
    <div class="tools">
      <button class="btn" id="nums">番号 表示/非表示</button>
      <button class="btn" id="shuffle">シャッフル</button>
      <button class="btn" id="reset">最初の並び</button>
      <button class="btn" id="save">画像を保存（PNG）</button>
    </div>
    <p class="hint">並びは自動で保存され、リンクにも入ります（このページのURLを送れば同じ並びで開けます）。</p>
  </section>
  <section class="tray">
    <h2>写真（28枚・@veganoji の投稿から）</h2>
    <p>赤い数字＝今入っているマス。薄い写真＝使用中。</p>
    <div class="ph" id="tray"></div>
  </section>
</div>
<div class="bar"><span id="sum"></span><button class="btn main" id="done">この並びで決定（コピー）</button></div>
<div class="toast" id="toast"></div>
<script>
const N = 28, PH = Array.from({length:N}, (_,i) => `/images/cover-lab/food/f${String(i+1).padStart(2,'0')}.jpg`);
const DEF = Array.from({length:16}, (_,i) => i);            // same as lab D3
let order = DEF.slice();
try {
  const q = new URLSearchParams(location.search).get('order') || localStorage.getItem('d3order');
  if (q) { const a = q.split(',').map(n => +n - 1); if (a.length === 16 && a.every(n => n >= 0 && n < N)) order = a; }
} catch (e) {}
const grid = document.getElementById('grid'), tray = document.getElementById('tray');
let sel = null; // {kind:'slot'|'photo', i}
function toast(t){ const e=document.getElementById('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),1600); }
function code(){ return order.map(n=>n+1).join(','); }
function persist(){
  try { localStorage.setItem('d3order', code()); } catch (e) {}
  const u = new URL(location.href); u.searchParams.set('order', code()); history.replaceState(null, '', u);
  document.getElementById('sum').textContent = 'D3の並び：' + code();
}
function render(){
  grid.innerHTML = order.map((p,s)=>`<div class="slot${sel&&sel.kind==='slot'&&sel.i===s?' sel':''}" data-slot="${s}" style="background-image:url(${PH[p]})"><span class="n">${s+1}</span></div>`).join('');
  tray.innerHTML = PH.map((u,p)=>{ const s=order.indexOf(p); return `<div class="${s>=0?'used':''}${sel&&sel.kind==='photo'&&sel.i===p?' sel':''}" data-photo="${p}" style="background-image:url(${u})">${s>=0?`<b>${s+1}</b>`:''}<i>${p+1}</i></div>`; }).join('');
  persist();
}
function place(slot, photo){ const prev = order.indexOf(photo); if (prev >= 0 && prev !== slot) order[prev] = order[slot]; order[slot] = photo; }
function swapSlots(a,b){ [order[a],order[b]] = [order[b],order[a]]; }
// tap logic
function tap(kind, i){
  if (!sel) { sel = {kind, i}; return render(); }
  if (sel.kind === kind && sel.i === i) { sel = null; return render(); }
  if (sel.kind === 'slot' && kind === 'slot') swapSlots(sel.i, i);
  else if (sel.kind === 'slot' && kind === 'photo') place(sel.i, i);
  else if (sel.kind === 'photo' && kind === 'slot') place(i, sel.i);
  else { sel = {kind, i}; return render(); }
  sel = null; render(); toast('入れ替えました');
}
// pointer drag (mouse + touch)
let drag = null;
function targetAt(x,y){ const el = document.elementFromPoint(x,y); const s = el && el.closest('[data-slot]'); return s ? +s.dataset.slot : null; }
document.addEventListener('pointerdown', e => {
  const s = e.target.closest('[data-slot]'), p = e.target.closest('[data-photo]');
  if (!s && !p) return;
  drag = { kind: s ? 'slot' : 'photo', i: +(s ? s.dataset.slot : p.dataset.photo), x: e.clientX, y: e.clientY, moved: false, ghost: null };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
  if (!drag.moved) { drag.moved = true; const g = document.createElement('div'); g.className = 'ghost'; g.style.backgroundImage = `url(${PH[drag.kind==='slot'?order[drag.i]:drag.i]})`; document.body.appendChild(g); drag.ghost = g; }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  document.querySelectorAll('.slot.over').forEach(x => x.classList.remove('over'));
  const t = targetAt(e.clientX, e.clientY); if (t !== null) grid.children[t].classList.add('over');
}, {passive:false});
document.addEventListener('pointerup', e => {
  if (!drag) return; const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  document.querySelectorAll('.slot.over').forEach(x => x.classList.remove('over'));
  if (!d.moved) return tap(d.kind, d.i);
  const t = targetAt(e.clientX, e.clientY); if (t === null) return;
  if (d.kind === 'slot') swapSlots(d.i, t); else place(t, d.i);
  sel = null; render(); toast('入れ替えました');
});
document.getElementById('nums').onclick = () => document.body.classList.toggle('edit');
document.getElementById('shuffle').onclick = () => { const pool = PH.map((_,i)=>i); for (let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]} order = pool.slice(0,16); sel=null; render(); };
document.getElementById('reset').onclick = () => { order = DEF.slice(); sel=null; render(); };
document.getElementById('done').onclick = async e => {
  const t = `カバー D3 の並び：${code()}\n${location.href}`;
  try { await navigator.clipboard.writeText(t); e.target.textContent = 'コピーしました ✓'; } catch (err) { prompt('コピーしてください', t); }
};
// scale preview
const frame = document.getElementById('frame');
new ResizeObserver(es => es.forEach(x => frame.style.setProperty('--s', x.contentRect.width / 1080))).observe(frame);

// ---- PNG export: redraws the same design on a 1080x1350 canvas ----
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
function cover(ctx, img, x, y, w, h){ const r=Math.max(w/img.width,h/img.height), sw=w/r, sh=h/r; ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h); }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function sticker(ctx,x,y,w,h,r,fill){ ctx.fillStyle='#1d1a17'; rr(ctx,x+8,y+8,w,h,r); ctx.fill(); rr(ctx,x,y,w,h,r); ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=6; ctx.strokeStyle='#1d1a17'; ctx.stroke(); }
document.getElementById('save').onclick = async e => {
  const b = e.target; b.textContent = '作成中…';
  try {
    await document.fonts.ready;
    await Promise.all(['900 92px "Zen Maru Gothic"','800 26px Inter','900 36px "Zen Maru Gothic"'].map(f=>document.fonts.load(f,'日本ビーガンマップ2027年版')));
    const c = document.createElement('canvas'); c.width=1080; c.height=1350; const x = c.getContext('2d');
    x.fillStyle='#1d1a17'; x.fillRect(0,0,1080,1350);
    const imgs = await Promise.all(order.map(p=>loadImg(PH[p])));
    const cw=(1080-24)/4; imgs.forEach((im,s)=>cover(x,im,(s%4)*(cw+8),Math.floor(s/4)*342,cw,334));
    const g = x.createRadialGradient(540,621,0,540,621,Math.hypot(540,729)); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.6,'rgba(0,0,0,.25)'); g.addColorStop(1,'rgba(0,0,0,.55)'); x.fillStyle=g; x.fillRect(0,0,1080,1350);
    // title card
    sticker(x,90,70,900,190,30,'#FFF9EE');
    x.textAlign='center'; x.textBaseline='alphabetic'; x.fillStyle='#1d1a17'; x.font='900 92px "Zen Maru Gothic"'; x.fillText('日本ビーガンマップ',540,190);
    x.fillStyle='#C9223A'; x.font='800 26px Inter'; x.letterSpacing='9px'; x.fillText('JAPAN VEGAN MAP · 2027',545,238); x.letterSpacing='0px';
    // pin
    const P = new Path2D('M100 6C49 6 10 45 10 96c0 66 78 150 86 160a5 5 0 0 0 8 0c8-10 86-94 86-160C190 45 151 6 100 6z');
    x.save(); x.translate(374,414); x.scale(1.8,1.8); x.fillStyle='#1d1a17'; x.fill(P); x.restore();
    x.save(); x.translate(360,400); x.scale(1.8,1.8); x.fillStyle='#C9223A'; x.fill(P); x.lineWidth=5; x.strokeStyle='#1d1a17'; x.stroke(P); x.restore();
    // face
    const fx=540, fy=573, fr=131.4; x.beginPath(); x.arc(fx,fy,fr,0,7); x.fillStyle='#fff'; x.fill();
    const oji = await loadImg('/images/mascot/map-japan.png'); x.save(); x.beginPath(); x.arc(fx,fy,fr-3,0,7); x.clip(); const ow=184, oh=ow*oji.height/oji.width; x.drawImage(oji,fx-ow/2,fy-fr+20,ow,oh); x.restore();
    x.beginPath(); x.arc(fx,fy,fr,0,7); x.lineWidth=7; x.strokeStyle='#1d1a17'; x.stroke();
    // pills
    x.font='900 36px "Zen Maru Gothic"'; const L=['2027年版','2,300店以上','47都道府県']; const W=L.map(t=>x.measureText(t).width+52+10); let px=(1080-(W.reduce((a,b)=>a+b,0)+32))/2;
    L.forEach((t,k)=>{ sticker(x,px,1150,W[k],80,22,k===0?'#C9223A':'#fff'); x.fillStyle=k===0?'#fff':'#1d1a17'; x.textBaseline='middle'; x.fillText(t,px+W[k]/2,1191); px+=W[k]+16; });
    const a = document.createElement('a'); a.download = `japan-vegan-map-2027-D3.png`; a.href = c.toDataURL('image/png'); a.click();
    b.textContent = '保存しました ✓';
  } catch (err) { b.textContent = '保存できませんでした'; console.log(err); }
};
render();
</script>
</body>
</html>
