<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ビーガン箱庭ニッポン｜ビーガン白書 2026</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFF9EE;--royal:#C9223A;--gold:#D4A847;--leaf:#5E8C52;--leaf-deep:#3F6A3A;--ink:#1F1812;--night:#13213F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",sans-serif;overflow:hidden}
.bar{height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;background:var(--paper);border-bottom:2.5px solid var(--ink);position:relative;z-index:5}
.bar a{font:700 15px/1 "Zen Maru Gothic",sans-serif;color:var(--ink);text-decoration:none;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:8px 12px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.bar span{font:900 16px/1 "Zen Maru Gothic",sans-serif;color:var(--royal);white-space:nowrap}
#stage{height:calc(100vh - 48px);height:calc(100dvh - 48px);min-height:520px}
.load{display:grid;place-items:center;height:100%;font:700 19px "Zen Maru Gothic",sans-serif;color:var(--leaf-deep)}
@media (min-width:700px){.bar{padding:0 24px}.bar a{font-size:16px}.bar span{font-size:19px}}
</style>
</head>
<body>
<header class="bar"><a href="../../">← ビーガン白書にもどる</a><span>ビーガン箱庭ニッポン</span></header>
<main id="stage"><p class="load">箱庭をひらいています…</p></main>
<script src="fx.js"></script>
<script>
Promise.all([fetch('../../data.json').then(r=>r.json()),fetch('../../jp.json').then(r=>r.json())])
  .then(([d,j])=>{window.__fx=initFx(document.getElementById('stage'),d,j)})
  .catch(()=>{document.querySelector('.load').textContent='ごめんね、うまく読みこめなかったよ。もう一度ひらいてみてね。'});
</script>
</body>
</html>
