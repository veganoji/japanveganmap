<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>水彩にじみマップ｜ビーガン白書 2026</title>
<link rel="icon" href="/images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFF9EE;--white:#FFFDF8;--cream:#FDF1DA;--line:#E9D9B5;--royal:#C9223A;--royal-deep:#9C1428;--gold:#D4A847;--gold-deep:#9C7E2A;
  --ink:#1F1812;--ink-soft:#3C2E22;--muted:#786148;--leaf:#5E8C52;--leaf-deep:#3F6A3A;--leaf-soft:#C9DDB9;
  --sans:'Noto Sans JP',sans-serif;--round:'Zen Maru Gothic','Noto Sans JP',sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:500 17px/1.7 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"palt";overflow-x:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1120px;margin:0 auto;padding:10px 16px 6px}
.bar a{font:700 16px/1.3 var(--round);color:var(--leaf-deep);text-decoration:none;padding:6px 2px;white-space:nowrap}
.bar a:hover{color:var(--royal)}
.bar span{font:900 16px/1.3 var(--round);color:var(--muted);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 18px}
h1{font:900 clamp(25px,6.6vw,38px)/1.25 var(--round);letter-spacing:.01em;margin:2px 0 6px;color:var(--leaf-deep)}
h1 b{color:var(--royal)}
#fx{min-height:420px}
.err{font:700 19px/1.6 var(--round);padding:24px 0}
@media(max-width:380px){.bar span{display:none}}
</style>
</head>
<body>
<nav class="bar"><a href="../../">← ビーガン白書にもどる</a><span>水彩にじみマップ</span></nav>
<main class="wrap">
  <h1>一滴が、<b>お店ひとつ。</b></h1>
  <div id="fx"></div>
</main>
<script src="suisai.js"></script>
<script>
Promise.all([fetch('../../data.json').then(r=>r.json()),fetch('../../jp.json').then(r=>r.json())])
  .then(([data,jp])=>{window.__fx=initFx(document.getElementById('fx'),data,jp)})
  .catch(()=>{document.getElementById('fx').innerHTML='<p class="err">ごめんね、地図を読みこめなかったよ。もう一度ひらいてみてね。</p>'});
</script>
</body>
</html>
