<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>王子スタンプ帳</title>
<link rel="icon" href="/images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFF9EE;--white:#FFFDF8;--cream:#FDF1DA;--cream2:#F6E4BD;--line:#EADCC0;--royal:#C9223A;--royal-deep:#9C1428;
  --gold:#D4A847;--gold-deep:#8A6D1F;--ink:#1F1812;--muted:#786148;--leaf:#6C9560;--leaf-deep:#3F6A3A;--night:#13213F}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:500 17px/1.6 'Noto Sans JP',sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:96px}
button,input{font:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,.round{font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;font-weight:900}
header{background:var(--royal);color:#fff;padding:18px 0 22px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
header .wrap{display:flex;align-items:center;gap:12px}
header img{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
header h1{font-size:28px;line-height:1.2}
header p{opacity:.9;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-14px auto 0;position:relative}
.stat{background:var(--white);border:2px solid var(--line);border-radius:18px;padding:10px 6px;text-align:center}
.stat b{display:block;font:900 30px/1.1 'Zen Maru Gothic',sans-serif;color:var(--royal)}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
.rank{margin:14px 0 4px;background:var(--night);color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.rank .crown{font-size:30px}
.rank b{font:900 20px/1.2 'Zen Maru Gothic',sans-serif;display:block}
.rank small{opacity:.8;font-size:13px}
.bar{height:10px;background:rgba(255,255,255,.18);border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .8s cubic-bezier(.2,.9,.3,1.2)}
h2{font-size:22px;margin:26px 0 10px}
.search{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0}
.search input{width:100%;padding:16px 18px;border:2px solid var(--line);border-radius:999px;background:var(--white);font-size:18px;outline:none}
.search input:focus{border-color:var(--royal)}
.results{display:grid;gap:8px}
.res{display:flex;align-items:center;gap:12px;background:var(--white);border:2px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;width:100%;cursor:pointer}
.res .em{font-size:24px}
.res b{display:block;font-size:17px;line-height:1.35}
.res small{color:var(--muted);font-size:14px}
.res.done{border-color:var(--gold);background:#FFF6DD}
.res .ok{margin-left:auto;font-size:22px}
.prefs{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.pref{border-radius:12px;padding:8px 2px;text-align:center;font-size:13px;font-weight:700;background:var(--cream);color:var(--muted);border:2px solid transparent;transition:.3s}
.pref.on{background:var(--leaf);color:#fff;transform:scale(1.02)}
.pref.on b{color:#fff}
.pref b{display:block;font:900 16px/1 'Zen Maru Gothic',sans-serif;color:var(--line)}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{aspect-ratio:1;border-radius:50%;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:700;color:var(--royal);padding:10px;position:relative;background:var(--white);cursor:pointer;overflow:hidden}
.mini.stamped{border:3px solid var(--royal);transform:rotate(var(--r,-6deg))}
.mini.gold{border-color:var(--gold-deep);color:var(--gold-deep);background:#FFF6DD}
.mini img.thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22}
.mini{flex-direction:column;gap:2px;border-style:double;border-width:5px}
.mini .cr{width:34%;position:relative}
.mini em{font-style:normal;font:900 15px/1 'Zen Maru Gothic',sans-serif;position:relative}
.mini small{font-size:10px;position:relative;opacity:.8}
.mini span{position:relative;line-height:1.2;font-size:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);text-align:center;padding:18px;background:var(--white);border-radius:16px;border:2px dashed var(--line)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{padding:8px 12px;border-radius:999px;background:var(--cream);color:var(--muted);font-weight:700;font-size:14px}
.badge.got{background:var(--gold);color:#fff}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%);z-index:9}
.dock .wrap{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:999px;padding:16px;font-weight:900;font-size:17px;cursor:pointer;background:var(--royal);color:#fff;box-shadow:0 4px 0 var(--royal-deep);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--royal-deep)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-deep)}
.btn.ghost{background:var(--white);color:var(--ink);border:2px solid var(--line);box-shadow:none}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(19,33,63,.55)}
.sheet.open{display:flex;animation:fade .2s}
.panel{background:var(--paper);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1.1)}
.panel h3{font:900 24px/1.3 'Zen Maru Gothic',sans-serif}
.panel .area{color:var(--muted);font-weight:700;margin-bottom:12px}
.stage{height:230px;display:flex;align-items:center;justify-content:center;position:relative}
.big{width:200px;height:200px;border-radius:50%;border:6px double var(--royal);color:var(--royal);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;background:rgba(201,34,58,.04);opacity:.15;transform:rotate(-8deg)}
.big img{width:62px}
.big b{font:900 26px/1.1 'Zen Maru Gothic',sans-serif}
.big small{font-size:12px;font-weight:700;line-height:1.3;max-height:2.6em;overflow:hidden}
.big.gold{border-color:var(--gold-deep);color:var(--gold-deep);background:rgba(212,168,71,.12)}
.big.hit{opacity:1;animation:stamp .55s cubic-bezier(.3,1.6,.5,1) both}
.stage.hit{animation:shake .35s .32s}
.ink{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--royal);opacity:0}
.stage.hit .ink{animation:splat .6s .3s ease-out both}
.photo{margin:8px 0 12px;background:var(--white);border:2px dashed var(--line);border-radius:18px;padding:14px}
.photo label.pick{display:flex;align-items:center;gap:10px;font-weight:900;cursor:pointer}
.photo input[type=file]{display:none}
.photo .prev{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px;display:none}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:10px;color:var(--ink)}
.consent input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--royal)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.row{display:flex;gap:10px;margin-top:12px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:var(--night);color:#fff;padding:12px 18px;border-radius:999px;font-weight:900;z-index:40;transition:.4s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@keyframes stamp{0%{transform:scale(2.3) rotate(-25deg);opacity:0}60%{transform:scale(.92) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px)}}
@keyframes splat{0%{opacity:.8;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(60%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <img src="/images/oji2/oji-excited.webp" alt="">
  <div><h1>王子スタンプ帳</h1><p>行ったお店にスタンプを押して、47都道府県ビーガン制覇をめざそう！</p></div>
</div></header>

<main class="wrap">
  <div class="stats">
    <div class="stat"><b id="sN">0</b><span>スタンプ</span></div>
    <div class="stat"><b id="sP">0</b><span>都道府県</span></div>
    <div class="stat"><b id="sPt">0</b><span>王子ポイント</span></div>
  </div>
  <div class="rank"><span class="crown">👑</span><div style="flex:1"><b id="rankName">見習いビーガン</b><small id="rankNext"></small><div class="bar"><i id="rankBar" style="width:0"></i></div></div></div>

  <div class="search"><input id="q" type="search" placeholder="お店の名前・エリアで探す（例：渋谷 ラーメン）" autocomplete="off"></div>
  <div class="results" id="results"></div>

  <h2>📒 わたしのスタンプ</h2>
  <div class="book" id="book"></div>

  <h2>🗾 47都道府県ビーガン制覇</h2>
  <div class="prefs" id="prefs"></div>

  <h2>🏅 バッジ</h2>
  <div class="badges" id="badges"></div>
</main>

<div class="dock"><div class="wrap">
  <button class="btn gold" id="shareBtn">📸 ストーリーでシェア</button>
</div></div>

<div class="sheet" id="sheet"><div class="panel">
  <h3 id="shName"></h3><p class="area" id="shArea"></p>
  <div class="stage" id="stage">
    <div class="big" id="bigStamp"><img src="/images/brand/leaf-crown-sm.png" alt=""><b>行った！</b><small id="bigName"></small><small id="bigDate"></small></div>
  </div>
  <div class="photo" id="photoBox">
    <label class="pick"><span style="font-size:26px">📷</span><span>写真をのせて<span style="color:var(--gold-deep)">金スタンプ</span>に！<br><small style="font-weight:500;color:var(--muted)">+20ポイント・料理やお店の写真</small></span><input type="file" id="file" accept="image/*"></label>
    <img class="prev" id="prev" alt="">
    <label class="consent"><input type="checkbox" id="consent"><span>この写真を日本ビーガンマップ（サイト・SNS）で紹介することに同意します。自分で撮った写真です。</span></label>
  </div>
  <div class="row" id="actRow">
    <button class="btn ghost" id="closeBtn">とじる</button>
    <button class="btn" id="stampBtn">ポン！と押す</button>
  </div>
  <p class="note" id="shNote"></p>
</div></div>

<div class="toast" id="toast"></div>
<canvas class="confetti" id="confetti"></canvas>

<script>
const PREFS='北海道,青森県,岩手県,宮城県,秋田県,山形県,福島県,茨城県,栃木県,群馬県,埼玉県,千葉県,東京都,神奈川県,新潟県,富山県,石川県,福井県,山梨県,長野県,岐阜県,静岡県,愛知県,三重県,滋賀県,京都府,大阪府,兵庫県,奈良県,和歌山県,鳥取県,島根県,岡山県,広島県,山口県,徳島県,香川県,愛媛県,高知県,福岡県,佐賀県,長崎県,熊本県,大分県,宮崎県,鹿児島県,沖縄県'.split(',');
const RANKS=[[0,'見習いビーガン'],[50,'ビーガン探検家'],[200,'ビーガン騎士'],[500,'ビーガン大臣'],[1000,'ビーガン王子'],[2500,'ビーガン国王']];
const KEY='ojiStamps:v1';
const $=(id)=>document.getElementById(id);
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{stamps:{}}}catch(e){return{stamps:{}}}};
const save=(d)=>{try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){toast('保存できませんでした（容量がいっぱいかも）')}};
let data=load(), shops=[], bySlug=new Map(), cur=null, photoUrl=null;
const prefOf=(a)=>(a||'').match(/^(北海道|東京都|京都府|大阪府|.{2,3}?県)/)?.[1]||'';
const esc=(s)=>String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function points(){let p=0;const seen=new Set();for(const [slug,s] of Object.entries(data.stamps)){p+=10;if(s.photo)p+=20;const pr=s.pref;if(pr&&!seen.has(pr)){seen.add(pr);p+=50}}return p}
function render(){
  const st=Object.entries(data.stamps).sort((a,b)=>b[1].t-a[1].t);
  const prefSet=new Set(st.map(([,s])=>s.pref).filter(Boolean));
  const pt=points();
  $('sN').textContent=st.length;$('sP').textContent=prefSet.size;$('sPt').textContent=pt;
  let i=0;while(i+1<RANKS.length&&pt>=RANKS[i+1][0])i++;
  $('rankName').textContent=RANKS[i][1];
  if(RANKS[i+1]){const a=RANKS[i][0],b=RANKS[i+1][0];$('rankNext').textContent=`あと${b-pt}ポイントで「${RANKS[i+1][1]}」`;$('rankBar').style.width=Math.round((pt-a)/(b-a)*100)+'%'}
  else{$('rankNext').textContent='最高ランク！';$('rankBar').style.width='100%'}
  $('book').innerHTML=st.length?st.map(([slug,s],k)=>`<div class="mini stamped ${s.photo?'gold':''}" style="--r:${(k*37%15)-8}deg" data-slug="${esc(slug)}">${s.thumb?`<img class="thumb" src="${s.thumb}" alt="">`:''}<img class="cr" src="/images/brand/leaf-crown-sm.png" alt=""><em>行った！</em><span>${esc(s.name)}</span><small>${new Date(s.t).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})}</small></div>`).join(''):'<p class="empty" style="grid-column:1/-1">まだスタンプがありません。<br>上の検索で、行ったお店を探してみよう！</p>';
  $('prefs').innerHTML=PREFS.map(p=>{const n=st.filter(([,s])=>s.pref===p).length;return `<div class="pref ${n?'on':''}"><b>${n||'・'}</b>${p.replace(/[都府県]$/,'')}</div>`}).join('');
  const nFull=st.filter(([,s])=>s.full).length,nPh=st.filter(([,s])=>s.photo).length;
  const B=[['はじめの一歩',st.length>=1],['5軒',st.length>=5],['🌿完全ヴィーガン5軒',nFull>=5],['📷写真3枚',nPh>=3],['3都道府県',prefSet.size>=3],['10都道府県',prefSet.size>=10],['50軒',st.length>=50],['🗾全国制覇',prefSet.size>=47]];
  $('badges').innerHTML=B.map(([n,g])=>`<span class="badge ${g?'got':''}">${g?'🏅 ':''}${n}</span>`).join('');
  search();
}
function search(){
  const q=$('q').value.trim().toLowerCase();
  if(!q){$('results').innerHTML='';return}
  const words=q.split(/\s+/);
  const hit=[];for(const s of shops){const hay=(s[1]+' '+s[2]+' '+s[3]+' '+s[4]).toLowerCase();if(words.every(w=>hay.includes(w))){hit.push(s);if(hit.length>=12)break}}
  $('results').innerHTML=hit.length?hit.map(s=>{const d=data.stamps[s[0]];return `<button class="res ${d?'done':''}" data-slug="${esc(s[0])}"><span class="em">${s[5]?'🌿':'🌱'}</span><span><b>${esc(s[1])}</b><small>${esc(s[3])}</small></span>${d?'<span class="ok">✅</span>':''}</button>`}).join(''):'<p class="empty">見つかりませんでした</p>';
}
function open(slug){
  const s=bySlug.get(slug);if(!s)return;cur=s;photoUrl=null;
  const d=data.stamps[slug];
  $('shName').textContent=s[1];$('shArea').textContent=(s[5]?'🌿 完全ヴィーガン・':'🌱 ヴィーガンメニューあり・')+s[3];
  $('bigName').textContent=s[1];$('bigDate').textContent=d?new Date(d.t).toLocaleDateString('ja-JP'):new Date().toLocaleDateString('ja-JP');
  const big=$('bigStamp');big.className='big'+(d?' hit'+(d.photo?' gold':''):'');
  $('stage').classList.remove('hit');
  $('prev').style.display='none';$('file').value='';$('consent').checked=false;
  $('photoBox').style.display=d&&d.photo?'none':'block';
  $('stampBtn').textContent=d?(d.photo?'押してあります ✅':'写真を追加して金スタンプに'):'ポン！と押す';
  $('stampBtn').disabled=!!(d&&d.photo);
  $('shNote').innerHTML=`<a href="/shop/${encodeURIComponent(slug)}/" target="_blank" rel="noopener">お店のページを見る ↗</a>`;
  $('sheet').classList.add('open');
}
function thumbOf(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),m=240,r=Math.min(m/img.width,m/img.height,1);c.width=img.width*r;c.height=img.height*r;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};img.onerror=rej;img.src=URL.createObjectURL(file)})}
async function doStamp(){
  if(!cur)return;const slug=cur[0],had=data.stamps[slug];
  const f=$('file').files[0];
  if(f&&!$('consent').checked){toast('写真の使用に同意のチェックをお願いします');return}
  if(had&&!f){toast('写真を選ぶと金スタンプになるよ');return}
  let thumb=had?.thumb||null;if(f){try{thumb=await thumbOf(f)}catch(e){}}
  const firstPref=!Object.values(data.stamps).some(s=>s.pref===prefOf(cur[3]));
  data.stamps[slug]={t:had?.t||Date.now(),name:cur[1],pref:prefOf(cur[3]),full:!!cur[5],photo:!!f||!!had?.photo,thumb};
  save(data);
  const big=$('bigStamp');big.className='big';void big.offsetWidth;big.className='big hit'+(f?' gold':'');
  const stg=$('stage');stg.classList.remove('hit');void stg.offsetWidth;stg.classList.add('hit');
  stg.querySelectorAll('.ink').forEach(e=>e.remove());
  for(let i=0;i<10;i++){const e=document.createElement('i');e.className='ink';const a=Math.random()*6.28,r=90+Math.random()*50;e.style.setProperty('--x',Math.cos(a)*r+'px');e.style.setProperty('--y',Math.sin(a)*r+'px');if(f)e.style.background='var(--gold)';stg.appendChild(e)}
  if(navigator.vibrate)navigator.vibrate([18,40,30]);
  $('stampBtn').textContent='押してあります ✅';$('stampBtn').disabled=true;$('photoBox').style.display='none';
  toast(f?'金スタンプ！ +30pt':firstPref?`${prefOf(cur[3])}はじめて！ +60pt`:'スタンプ！ +10pt');
  if(firstPref||f)confetti();
  render();
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
function confetti(){const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*14-4,s:6+Math.random()*6,c:['#C9223A','#D4A847','#6C9560','#13213F'][Math.random()*4|0],r:Math.random()*6}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);for(const p of P){p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}if(++n<110)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
async function share(){
  const st=Object.values(data.stamps),prefSet=new Set(st.map(s=>s.pref).filter(Boolean));
  const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');
  x.fillStyle='#FFF9EE';x.fillRect(0,0,1080,1920);
  x.fillStyle='#C9223A';x.beginPath();x.roundRect(0,-60,1080,560,80);x.fill();
  const img=new Image();img.src='/images/oji2/oji-excited.webp';await img.decode().catch(()=>{});
  try{x.drawImage(img,680,90,340,340)}catch(e){}
  x.fillStyle='#fff';x.font='900 92px "Zen Maru Gothic","Noto Sans JP",sans-serif';x.fillText('王子スタンプ帳',70,230);
  x.font='700 46px "Noto Sans JP",sans-serif';x.fillText('日本ビーガンマップ',74,320);
  x.fillStyle='#1F1812';x.font='900 300px "Zen Maru Gothic",sans-serif';x.textAlign='center';x.fillText(st.length,540,860);
  x.font='900 64px "Zen Maru Gothic",sans-serif';x.fillText('軒のビーガンスポットに行った！',540,960);
  x.fillStyle='#3F6A3A';x.fillText(`${prefSet.size} / 47 都道府県`,540,1070);
  const cols=8,w=112,h=60,g=10,ox=(1080-(cols*w+(cols-1)*g))/2;
  PREFS.forEach((p,i)=>{const cx=ox+(i%cols)*(w+g),cy=1150+Math.floor(i/cols)*(h+g);x.fillStyle=prefSet.has(p)?'#6C9560':'#FDF1DA';x.beginPath();x.roundRect(cx,cy,w,h,14);x.fill();x.fillStyle=prefSet.has(p)?'#fff':'#B8A27E';x.font='700 26px "Noto Sans JP",sans-serif';x.fillText(p.replace(/[都府県]$/,''),cx+w/2,cy+40)});
  x.fillStyle='#13213F';x.font='900 52px "Zen Maru Gothic",sans-serif';x.fillText('👑 '+$('rankName').textContent+' 👑',540,1720);
  x.fillStyle='#786148';x.font='700 40px "Noto Sans JP",sans-serif';x.fillText('veganmapjapan.org  @veganoji',540,1820);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));const file=new File([blob],'oji-stamps.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:'#王子スタンプ帳 #日本ビーガンマップ'});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='oji-stamps.png';a.click();
}
