<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FBE7B5">
<title>王子スタンプ帳</title>
<link rel="icon" href="/images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFF9EE;--white:#FFFDF8;--cream:#FDF1DA;--cream2:#F6E4BD;--line:#EADCC0;--royal:#C9223A;--royal-deep:#9C1428;
  --gold:#D4A847;--gold-soft:#E8C76F;--gold-deep:#8A6D1F;--ink:#1F1812;--muted:#8A7458;--leaf:#6C9560;--leaf-deep:#3F6A3A;--night:#13213F;
  --round:'Zen Maru Gothic','Noto Sans JP',sans-serif;--ease:cubic-bezier(.3,1.5,.5,1)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper) url(/images/scene/page-wash-portrait.webp) center top/100% auto repeat-y;color:var(--ink);font:500 16px/1.5 'Noto Sans JP',sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:110px;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.r{font-family:var(--round);font-weight:900}

/* ── sky header ───────────────────────────── */
.sky{position:relative;height:300px;background:url(/images/scene/hero-sky.webp) center/cover;overflow:hidden;border-radius:0 0 34px 34px}
.cloud{position:absolute;opacity:.95;pointer-events:none;animation:drift 38s linear infinite}
.cloud.a{width:150px;top:26px;left:-160px}
.cloud.b{width:110px;top:84px;left:-120px;animation-duration:52s;animation-delay:-20s;opacity:.8}
@keyframes drift{to{transform:translateX(calc(100vw + 340px))}}
.hills{position:absolute;left:-10%;right:-10%;bottom:-8px;height:96px;background:url(/images/scene/hero-hills.webp) center bottom/auto 100% repeat-x}
.title{position:absolute;left:18px;top:22px;z-index:2}
.title h1{font:900 30px/1.1 var(--round);color:var(--royal);text-shadow:0 2px 0 #fff,0 0 18px rgba(255,255,255,.8)}
.title p{font:900 13px/1 var(--round);color:var(--gold-deep);letter-spacing:.14em;margin-top:6px}
.oji{position:absolute;right:10px;bottom:22px;height:205px;z-index:2;transform-origin:50% 100%;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(80,50,10,.2))}
.oji.jump{animation:jump .7s var(--ease)}
.oji{cursor:pointer}
.oji.tilt{animation:tilt .9s var(--ease)}
@keyframes tilt{30%{transform:rotate(-6deg) translateY(-4px)}65%{transform:rotate(4deg)}}
.score .sc{animation:rise .55s var(--ease) both}.score .sc:nth-child(2){animation-delay:.07s}.score .sc:nth-child(3){animation-delay:.14s}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes jump{0%{transform:scale(1,1)}25%{transform:scale(1.08,.9)}55%{transform:translateY(-34px) scale(.96,1.06)}100%{transform:none}}
.bubble{position:absolute;right:150px;bottom:150px;z-index:3;background:#fff;border-radius:18px;padding:8px 14px;font:900 16px/1.3 var(--round);box-shadow:0 6px 18px -8px rgba(80,50,10,.35);transform-origin:100% 100%;animation:pop .5s var(--ease) both}
.bubble::after{content:"";position:absolute;right:-6px;bottom:10px;border:8px solid transparent;border-left-color:#fff}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}

/* ── score ───────────────────────────── */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-46px;position:relative;z-index:4}
.sc{background:rgba(255,253,248,.94);backdrop-filter:blur(6px);border-radius:20px;padding:10px 4px 8px;text-align:center;box-shadow:0 10px 24px -14px rgba(80,50,10,.45)}
.sc b{display:block;font:900 32px/1.05 var(--round);color:var(--royal);font-variant-numeric:tabular-nums}
.sc:nth-child(2) b{color:var(--leaf-deep)} .sc:nth-child(3) b{color:var(--gold-deep)}
.sc span{font-size:12px;font-weight:700;color:var(--muted)}
.flip{animation:tick .5s var(--ease)}
@keyframes tick{0%{transform:translateY(-40%) scale(1.3);opacity:.2}100%{transform:none;opacity:1}}
.rank{display:flex;align-items:center;gap:14px;margin:12px 0 0;background:rgba(255,253,248,.95);border-radius:24px;padding:14px 16px 16px;box-shadow:0 10px 24px -14px rgba(80,50,10,.45);animation:rise .6s .15s var(--ease) both}
.crest{position:relative;width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFF6D2,var(--gold-soft) 58%,var(--gold));box-shadow:0 8px 16px -8px var(--gold-deep),inset 0 0 0 3px rgba(255,255,255,.7);animation:crest 4.5s ease-in-out infinite}
.crest::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px dashed rgba(138,109,31,.45);animation:spin 18s linear infinite}
.crest img{width:44px;filter:drop-shadow(0 2px 2px rgba(80,50,10,.25))}
.crest.up{animation:rankup .9s var(--ease)}
@keyframes crest{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-2px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rankup{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-14deg)}60%{transform:scale(.92) rotate(8deg)}100%{transform:none}}
.rk{flex:1;min-width:0}
.rtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rtop small{display:block;font:900 11px/1 var(--round);letter-spacing:.18em;color:var(--gold-deep);margin-bottom:3px}
.rtop b{font:900 28px/1.05 var(--round);color:var(--night);white-space:nowrap}
.rtop .next{font:900 17px/1 var(--round);color:var(--royal);white-space:nowrap}
.bar{position:relative;height:18px;border-radius:999px;background:var(--cream2);margin:10px 14px 0 0;box-shadow:inset 0 2px 4px rgba(80,50,10,.18)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;min-width:18px;border-radius:999px;overflow:hidden;background:linear-gradient(180deg,#F8DD8C,var(--gold) 55%,#C2922A);box-shadow:inset 0 -2px 0 rgba(138,109,31,.35),inset 0 2px 0 rgba(255,255,255,.5);transition:width 1.3s cubic-bezier(.2,.9,.3,1.12)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.85) 48%,transparent 66%) 0 0/240% 100%;animation:sweep 2.8s ease-in-out infinite}
@keyframes sweep{0%,35%{background-position:140% 0}100%{background-position:-60% 0}}
.goal{position:absolute;right:-14px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:var(--white);box-shadow:0 0 0 3px var(--gold),0 4px 8px -3px rgba(80,50,10,.4);display:grid;place-items:center;font-size:15px;animation:goal 2.2s ease-in-out infinite}
@keyframes goal{50%{transform:scale(1.12)}}
.nextname{display:block;text-align:right;margin:8px 14px 0 0;font:900 13px/1 var(--round);color:var(--muted)}
.nextname b{color:var(--gold-deep)}

/* ── search ───────────────────────────── */
.search{position:sticky;top:0;z-index:8;padding:12px 0 8px;background:linear-gradient(var(--paper) 75%,transparent)}
.search label{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:999px;padding:6px 8px 6px 18px;box-shadow:0 0 0 2px var(--line),0 8px 18px -12px rgba(80,50,10,.4)}
.search label:focus-within{box-shadow:0 0 0 3px var(--royal)}
.search input{flex:1;border:0;outline:0;background:none;font-size:18px;padding:10px 0;min-width:0}
.search .go{width:44px;height:44px;border-radius:50%;background:var(--royal);display:grid;place-items:center;flex:none}
.search .go img{width:26px;filter:brightness(10)}
.search.pulse label{animation:spulse .6s var(--ease)}
@keyframes spulse{30%{transform:scale(1.05)}60%{transform:scale(.98)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--white);border-radius:999px;padding:6px 14px 6px 8px;font:900 15px/1 var(--round);box-shadow:0 0 0 2px var(--line);animation:rise .45s var(--ease) both;animation-delay:calc(.25s + var(--i)*60ms);transition:transform .15s}
.chip img{width:30px;height:30px}
.chip:active{transform:scale(.9)}
.chip.on{background:var(--royal);color:#fff;box-shadow:0 0 0 2px var(--royal)}
.results{display:grid;gap:8px;margin-bottom:6px}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--white);border-radius:18px;padding:8px 12px 8px 8px;box-shadow:0 0 0 2px var(--line);animation:cascade .5s var(--ease) both;animation-delay:calc(var(--i)*45ms);transition:transform .15s}
.res:active{transform:scale(.97)}
.res img{transition:transform .3s var(--ease)}
.res:hover img{transform:rotate(-10deg) scale(1.1)}
@keyframes cascade{0%{transform:translateY(18px) scale(.92);opacity:0}100%{transform:none;opacity:1}}
.res img{width:48px;height:48px;flex:none}
.res b{display:block;font-size:16px;line-height:1.3}
.res small{display:block;font-size:13px;color:var(--muted)}
.res .ck{margin-left:auto;width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;background:var(--cream)}
.res.done .ck{background:var(--royal);color:#fff}
.res.gold .ck{background:var(--gold);color:#fff}
@keyframes rise{from{transform:translateY(14px);opacity:0}}

/* ── sections ───────────────────────────── */
.sec{margin-top:28px}
.sec h2{display:flex;align-items:baseline;gap:8px;font:900 24px/1.2 var(--round);margin-bottom:10px}
.sec:not(.in) h2{opacity:0;transform:translateX(-24px)}
.sec.in h2{transition:opacity .5s,transform .6s var(--ease)}
.sec:not(.in) .page,.sec:not(.in) .jp,.sec:not(.in) .badges{opacity:0}
.sec.in .jp{animation:rise .6s var(--ease) both}
.sec.in .jp:not(.settled) .tile{animation:tin .5s var(--ease) both;animation-delay:calc(var(--d)*28ms)}
@keyframes tin{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.sec.in .badges:not(.settled) .bd{animation:bdin .55s var(--ease) both;animation-delay:calc(var(--i)*70ms)}
@keyframes bdin{0%{transform:translateY(20px) scale(.5);opacity:0}100%{transform:none;opacity:1}}
.bd.got i{animation:medal 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.4s)}
@keyframes medal{0%,80%,100%{transform:none}86%{transform:rotate(-12deg) scale(1.08)}93%{transform:rotate(10deg)}}
.sec h2 small{font:700 14px/1 'Noto Sans JP';color:var(--muted)}

/* passport page */
.page{position:relative;background:var(--white) url(/images/scene/page-wash-portrait.webp) center/cover;border-radius:8px 22px 22px 8px;padding:18px 14px 18px 22px;box-shadow:0 0 0 2px var(--line),-6px 0 0 -2px var(--cream2),0 16px 30px -18px rgba(80,50,10,.5);transform-origin:0 50%}
.sec.in .page{animation:turn .9s cubic-bezier(.2,.8,.2,1) both}
.page::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px)}
@keyframes turn{from{transform:perspective(900px) rotateY(-70deg);opacity:0}}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.st{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;animation:land .5s var(--ease) both;animation-delay:calc(var(--i)*45ms)}
@keyframes land{0%{transform:scale(1.6) rotate(-20deg);opacity:0}100%{transform:rotate(var(--r));opacity:1}}
.st{transform:rotate(var(--r))}
.st .ring{position:absolute;inset:0;border-radius:50%;border:4px double var(--royal);background:radial-gradient(rgba(201,34,58,.06),rgba(201,34,58,.02) 70%);mix-blend-mode:multiply}
.st.gold .ring{border-color:var(--gold-deep);background:radial-gradient(rgba(212,168,71,.25),rgba(212,168,71,.08) 70%)}
.st .ph{position:absolute;inset:7px;border-radius:50%;overflow:hidden;opacity:.9}
.st .ph img{width:100%;height:100%;object-fit:cover}
.st .ic{width:56%;position:relative}
.st.gold.has-ph .ic{display:none}
.st .nm{position:absolute;left:-4px;right:-4px;bottom:-12px;text-align:center;font:900 11px/1.15 var(--round);color:var(--royal);background:var(--white);border-radius:8px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px -3px rgba(0,0,0,.3)}
.st.gold .nm{color:var(--gold-deep)}
.st.gold::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%) 0 0/250% 100%;animation:shine 3.5s ease-in-out infinite;mix-blend-mode:soft-light}
@keyframes shine{0%,60%{background-position:150% 0}100%{background-position:-60% 0}}
.st[data-slug]:hover,.st[data-slug]:active{animation:wob .55s var(--ease)}
@keyframes wob{0%{transform:rotate(var(--r))}30%{transform:rotate(calc(var(--r) - 9deg)) scale(1.1)}60%{transform:rotate(calc(var(--r) + 6deg)) scale(.97)}100%{transform:rotate(var(--r))}}
.st.empty{border:3px dashed var(--line);animation:breathe 3s ease-in-out infinite;animation-delay:calc(var(--i,0)*.3s);transform:none;opacity:.8}
@keyframes breathe{50%{transform:scale(.94);opacity:.55}}
.st.empty img{width:46%;opacity:.25;filter:grayscale(1)}
.st.new{animation:slam .6s var(--ease) both}
@keyframes slam{0%{transform:scale(2.4) rotate(-30deg);opacity:0}60%{transform:scale(.9) rotate(var(--r));opacity:1}100%{transform:rotate(var(--r))}}

/* tile map of Japan */
.jp{position:relative;display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:repeat(12,1fr);gap:3px;aspect-ratio:13/12;background:rgba(255,253,248,.6);border-radius:22px;padding:10px}
.tile{border-radius:7px;background:var(--cream2);display:grid;place-items:center;font:900 9.5px/1 var(--round);color:#BCA67F;position:relative;transition:background .4s,color .4s}
.tile.on{background:var(--leaf);color:#fff}
.tile.on.lots{background:var(--leaf-deep)}
.tile.pop{animation:tpop .7s var(--ease)}
.tile.pop::after{content:"";position:absolute;inset:-4px;border-radius:10px;border:3px solid var(--gold);animation:ring .8s ease-out forwards}
@keyframes tpop{40%{transform:scale(1.7);z-index:2}}
@keyframes ring{to{inset:-16px;opacity:0}}
.jp .cap{position:absolute;left:14px;top:12px;font:900 30px/1 var(--round);color:var(--leaf-deep)}
.jp .cap small{font-size:15px;color:var(--muted)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bd{text-align:center;font:900 11px/1.2 var(--round);color:var(--muted)}
.bd i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 5px;border-radius:50%;background:var(--cream2);font-style:normal;font-size:26px;filter:grayscale(1);opacity:.55;transition:.4s}
.bd.got{color:var(--ink)}
.bd.got i{filter:none;opacity:1;background:radial-gradient(circle at 35% 30%,#FFF3C4,var(--gold-soft) 60%,var(--gold));box-shadow:0 6px 14px -6px var(--gold-deep)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 35%)}
.dock .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:15px 18px;font:900 18px/1 var(--round);background:var(--royal);color:#fff;box-shadow:0 5px 0 var(--royal-deep);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px) scale(.95,.9);box-shadow:0 1px 0 var(--royal-deep)}
.btn .wg{display:inline-block}
.dock .btn .wg{animation:wiggle 5s ease-in-out infinite}
.dock .btn:nth-child(2) .wg{animation-delay:2.5s}
.btn.tap .wg{animation:wiggle2 .6s var(--ease)}
@keyframes wiggle{0%,86%,100%{transform:none}89%{transform:rotate(-16deg) scale(1.15)}93%{transform:rotate(12deg)}96%{transform:rotate(-6deg)}}
@keyframes wiggle2{30%{transform:rotate(-20deg) scale(1.3)}60%{transform:rotate(14deg)}}
.dock{animation:dockin .6s .4s var(--ease) both}
@keyframes dockin{from{transform:translateY(120%)}}
.btn.gold{background:var(--gold);box-shadow:0 5px 0 var(--gold-deep)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-deep)}
.btn.light{background:var(--white);color:var(--ink);box-shadow:0 0 0 2px var(--line),0 5px 0 var(--line)}
.btn img{width:26px;height:26px}

/* ── stamp sheet ───────────────────────────── */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(31,24,18,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.open{opacity:1;pointer-events:auto}
.panel{position:relative;width:100%;max-width:520px;background:var(--paper) url(/images/scene/page-wash-portrait.webp) center/cover;border-radius:30px 30px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.5,0,.75,0);max-height:94vh;overflow:auto}
.sheet.open .panel{transform:none;transition:transform .6s cubic-bezier(.25,1.35,.45,1)}
.sheet.open .shop,.sheet.open .stage,.sheet.open .acts,.sheet.open .link{animation:rise .5s var(--ease) both}
.sheet.open .shop{animation-delay:.12s}.sheet.open .stage{animation-delay:.2s}.sheet.open .acts{animation-delay:.28s}.sheet.open .link{animation-delay:.34s}
.sheet.open .slot:not(.stamped) .hint img{animation:hintbob 1.6s ease-in-out infinite}
@keyframes hintbob{50%{transform:translateY(-6px) rotate(-6deg)}}
.slot:not(.stamped){animation:slotpulse 2.4s ease-in-out infinite}
@keyframes slotpulse{50%{transform:scale(1.03)}}
.slot:active{transform:scale(.94)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.x{position:absolute;right:14px;top:12px;width:40px;height:40px;border-radius:50%;background:var(--white);box-shadow:0 0 0 2px var(--line);font-size:20px;line-height:40px;text-align:center}
.shop{display:flex;align-items:center;gap:12px;padding-right:40px}
.shop img{width:58px;height:58px;flex:none}
.shop b{display:block;font:900 20px/1.25 var(--round)}
.shop small{color:var(--muted);font-size:13px;font-weight:700}
.stage{position:relative;height:250px;display:grid;place-items:center;margin:4px 0}
.slot{position:relative;width:212px;height:212px;border-radius:50%;display:grid;place-items:center;border:3px dashed var(--cream2);transition:border-color .3s}
.slot .hint{font:900 16px/1.3 var(--round);color:#C9B48C;text-align:center}
.slot .hint img{width:64px;margin:0 auto 4px;opacity:.35;filter:grayscale(1)}
.slot.has-ph{border-color:var(--gold)}
.slot .phv{position:absolute;inset:8px;border-radius:50%;overflow:hidden;display:none}
.slot.has-ph .phv{display:block;animation:pop .4s var(--ease)}
.slot .phv img{width:100%;height:100%;object-fit:cover}
.slot.has-ph .hint{display:none}
.big{position:absolute;inset:0;border-radius:50%;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--royal);border:7px double var(--royal);background:radial-gradient(rgba(255,253,248,.55),rgba(255,253,248,.2));mix-blend-mode:multiply}
.big img{width:78px}
.big b{font:900 30px/1.05 var(--round);margin-top:2px}
.big small{font:900 12px/1.2 var(--round);margin-top:4px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big.gold{color:var(--gold-deep);border-color:var(--gold-deep)}
.slot.stamped .big{display:flex;transform:rotate(-9deg)}
.slot.has-ph .big{mix-blend-mode:normal;background:radial-gradient(circle,rgba(255,253,248,.88) 38%,rgba(255,253,248,.25) 72%)}
.slot.stamped.hit .big{animation:bigslam .55s cubic-bezier(.3,1.6,.5,1) both}
.slot.stamped .hint{display:none}
@keyframes bigslam{0%{transform:scale(2.4) rotate(-32deg);opacity:0}55%{transform:scale(.9) rotate(-7deg);opacity:1}100%{transform:rotate(-9deg)}}
.stage.hit{animation:shake .32s .3s}
@keyframes shake{25%{transform:translate(-5px,3px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
.ink{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:var(--c,var(--royal));opacity:0;pointer-events:none}
.stage.hit .ink{animation:splat .7s .28s cubic-bezier(.1,.7,.3,1) both}
@keyframes splat{0%{opacity:.85;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}}
.plus{position:absolute;left:50%;top:2%;z-index:3;font:900 34px/1 var(--round);color:var(--royal);transform:translateX(-50%);pointer-events:none;opacity:0;text-shadow:0 2px 0 #fff}
.plus.gold{color:var(--gold-deep)}
.plus.go{animation:float 1.3s .45s ease-out both}
@keyframes float{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80px)}}
.mini-oji{position:absolute;right:-6px;bottom:-4px;height:120px;transform:translateX(130%);transition:transform .5s var(--ease)}
.mini-oji.in{transform:none}
.acts{display:flex;gap:10px}
.cam{flex:0 0 auto;width:96px;flex-direction:column;gap:2px;padding:10px 8px;font-size:13px}

.ok .sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.ok input:checked+.sw{background:var(--leaf)}
.ok input:checked+.sw::after{transform:translateX(20px)}
.ok[hidden]{display:none}
.link{display:block;text-align:center;margin-top:12px;font-weight:700;font-size:14px;color:var(--muted)}

.toast{position:fixed;left:50%;top:14px;z-index:40;transform:translate(-50%,-220%);background:var(--night);color:#fff;padding:12px 20px;border-radius:999px;font:900 16px/1.2 var(--round);transition:transform .45s var(--ease);white-space:nowrap;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:45}

<body>

</div></div>

<div class="toast" id="toast"></div>
<canvas class="confetti" id="confetti"></canvas>

<script>
'use strict';
const PREFS='北海道,青森県,岩手県,宮城県,秋田県,山形県,福島県,茨城県,栃木県,群馬県,埼玉県,千葉県,東京都,神奈川県,新潟県,富山県,石川県,福井県,山梨県,長野県,岐阜県,静岡県,愛知県,三重県,滋賀県,京都府,大阪府,兵庫県,奈良県,和歌山県,鳥取県,島根県,岡山県,広島県,山口県,徳島県,香川県,愛媛県,高知県,福岡県,佐賀県,長崎県,熊本県,大分県,宮崎県,鹿児島県,沖縄県'.split(',');
// tile-grid map of Japan: [col,row] in a 13x12 grid
const TILE={北海道:[12,0],青森県:[12,1],秋田県:[11,2],岩手県:[12,2],山形県:[11,3],宮城県:[12,3],石川県:[8,4],富山県:[9,4],新潟県:[10,4],福島県:[11,4],
 福井県:[7,5],岐阜県:[8,5],長野県:[9,5],群馬県:[10,5],栃木県:[11,5],茨城県:[12,5],島根県:[3,6],鳥取県:[4,6],兵庫県:[5,6],京都府:[6,6],滋賀県:[7,6],愛知県:[8,6],山梨県:[9,6],埼玉県:[10,6],東京都:[11,6],千葉県:[12,6],
 山口県:[2,7],広島県:[3,7],岡山県:[4,7],大阪府:[5,7],奈良県:[6,7],三重県:[7,7],静岡県:[9,7],神奈川県:[10,7],佐賀県:[0,8],福岡県:[1,8],大分県:[2,8],愛媛県:[3,8],香川県:[4,8],徳島県:[5,8],和歌山県:[6,8],
 長崎県:[0,9],熊本県:[1,9],宮崎県:[2,9],高知県:[4,9],鹿児島県:[1,10],沖縄県:[0,11]};
const SHORT=(p)=>({北海道:'北海',神奈川県:'神奈',和歌山県:'和歌',鹿児島県:'鹿児'}[p]||p.replace(/[都府県]$/,''));
const RANKS=[[0,'見習い'],[50,'探検家'],[200,'騎士'],[500,'大臣'],[1000,'王子'],[2500,'国王']];
const ICONS=new Set(['teishoku','sweets','curry','bakery','bowl','course','ramen','drink','noodles','salad','burger','pizza','bento','pasta','fried','gyoza','sushi','tofu','otsumami']);
const KW={teishoku:'定食 和食',sweets:'スイーツ ケーキ カフェ',curry:'カレー インド',bakery:'パン ベーカリー',bowl:'丼 ボウル',course:'コース レストラン',ramen:'ラーメン 麺',drink:'カフェ ドリンク スムージー',noodles:'麺 うどん そば',salad:'サラダ',burger:'バーガー ハンバーガー',pizza:'ピザ',bento:'弁当',pasta:'パスタ イタリアン',fried:'揚げ物 からあげ',gyoza:'餃子 中華',sushi:'寿司 すし',tofu:'豆腐',otsumami:'居酒屋 おつまみ'};
const icon=(type,full)=>`/images/menu2/${ICONS.has(type)?type:full?'leaf':'sprout'}.webp`;
const KEY='ojiStamps:v1';
const $=(id)=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=(s)=>String(s??'').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));return d&&d.stamps?d:{stamps:{}}}catch(e){return{stamps:{}}}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('保存できませんでした');return false}};
const prefOf=(a)=>((a||'').match(/^(北海道|東京都|京都府|大阪府|.{2,3}?県)/)||[])[1]||'';
let data=load(),shops=[],bySlug=new Map(),cur=null,pendingPhoto=null,last={};

function points(){let p=0;const seen=new Set();for(const s of Object.values(data.stamps).sort((a,b)=>a.t-b.t)){p+=10;if(s.photo)p+=20;if(s.pref&&!seen.has(s.pref)){seen.add(s.pref);p+=50}}return p}
function setNum(id,v){const el=$(id);if(String(el.textContent)===String(v))return;el.textContent=v;if(!reduce&&last[id]!==undefined){el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip')}last[id]=v}
function render(newSlug,newPref){
  const st=Object.entries(data.stamps).sort((a,b)=>b[1].t-a[1].t);
  const prefCount={};for(const[,s]of st)if(s.pref)prefCount[s.pref]=(prefCount[s.pref]||0)+1;
  const nPref=Object.keys(prefCount).length,pt=points();
  setNum('sN',st.length);setNum('sP',nPref);setNum('sPt',pt);
  let i=0;while(i+1<RANKS.length&&pt>=RANKS[i+1][0])i++;
  $('rankName').textContent=RANKS[i][1];
  if(last.rank!==undefined&&i>last.rank&&!reduce){const c=$('crest');c.classList.remove('up');void c.offsetWidth;c.classList.add('up');setTimeout(()=>toast(`👑 ランクアップ！ ${RANKS[i][1]}`),900)}
  last.rank=i;
  if(RANKS[i+1]){const a=RANKS[i][0],b=RANKS[i+1][0];$('rankNext').textContent=`あと${b-pt}pt`;$('nextName').innerHTML=`つぎは <b>${RANKS[i+1][1]}</b>`;requestAnimationFrame(()=>$('rankBar').style.width=Math.max(6,Math.round((pt-a)/(b-a)*100))+'%')}
  else{$('rankNext').textContent='MAX';$('nextName').textContent='';$('rankBar').style.width='100%'}
  $('bookN').textContent=st.length?`${st.length}こ`:'';
  const cells=st.map(([slug,s],k)=>{const r=((k*37)%15)-7;return `<button type="button" class="st ${s.photo?'gold':''} ${s.thumb?'has-ph':''} ${slug===newSlug?'new':''}" style="--r:${r}deg;--i:${k}" data-slug="${esc(slug)}"><span class="ring"></span>${s.thumb?`<span class="ph"><img src="${s.thumb}" alt=""></span>`:''}<img class="ic" src="${icon(s.type,s.full)}" alt=""><span class="nm">${esc(s.name)}</span></button>`});
  const empties=Math.max(6-st.length,(3-st.length%3)%3);
  for(let k=0;k<empties;k++)cells.push(`<div class="st empty" style="--i:${k}"><img src="/images/brand/leaf-crown-sm.png" alt=""></div>`);
  $('book').innerHTML=cells.join('');
  $('jp').innerHTML=`<div class="cap">${nPref}<small> / 47</small></div>`+PREFS.map(p=>{const[c,r]=TILE[p];const n=prefCount[p]||0;return `<div class="tile ${n?'on':''} ${n>=5?'lots':''} ${p===newPref?'pop':''}" style="grid-column:${c+1};grid-row:${r+1};--d:${(12-c)+r}" title="${p} ${n}">${SHORT(p)}</div>`}).join('');
  const nFull=st.filter(([,s])=>s.full).length,nPh=st.filter(([,s])=>s.photo).length;
  const B=[['🌱','はじめて',st.length>=1],['🍽️','5軒',st.length>=5],['🌿','完全5軒',nFull>=5],['📷','写真3枚',nPh>=3],['🗾','3県',nPref>=3],['🚄','10県',nPref>=10],['👑','50軒',st.length>=50],['🏯','全国',nPref>=47]];
  $('badges').innerHTML=B.map(([e,n,g],k)=>`<div class="bd ${g?'got':''}" style="--i:${k}"><i>${e}</i>${n}</div>`).join('');
  search();
}
function search(){
  const q=$('q').value.trim().toLowerCase();
  if(!q){$('results').innerHTML='';return}
  const words=q.split(/\s+/),hit=[];
  for(const s of shops){const hay=(s[1]+' '+s[2]+' '+s[3]+' '+s[4]+' '+(KW[s[6]]||'')+(s[5]?' 完全ヴィーガン':'')).toLowerCase();if(words.every(w=>hay.includes(w))){hit.push(s);if(hit.length>=10)break}}
  $('results').innerHTML=hit.length?hit.map((s,k)=>{const d=data.stamps[s[0]];return `<button type="button" class="res ${d?'done':''} ${d&&d.photo?'gold':''}" style="--i:${k}" data-slug="${esc(s[0])}"><img src="${icon(s[6],s[5])}" alt=""><span><b>${esc(s[1])}</b><small>${s[5]?'🌿':'🌱'} ${esc(s[3])}</small></span><span class="ck">${d?'✓':'＋'}</span></button>`}).join(''):(shops.length?'<p style="text-align:center;color:var(--muted);padding:10px">見つからない…</p>':'');
}
function setPhoto(url){pendingPhoto=url;$('slot').classList.toggle('has-ph',!!url);if(url)$('phImg').src=url;$('okRow').hidden=!url;$('stampBtn').textContent=url?'金スタンプ！':'ポン！';$('stampBtn').classList.toggle('gold',!!url)}
function open(slug){
  const s=bySlug.get(slug);if(!s)return;cur=s;
  const d=data.stamps[slug];
  $('shIcon').src=icon(s[6],s[5]);$('shName').textContent=s[1];$('shArea').textContent=(s[5]?'🌿 完全ヴィーガン · ':'🌱 ヴィーガンあり · ')+s[3];
  $('bigName').textContent=s[1];$('bigDate').textContent=new Date(d?d.t:Date.now()).toLocaleDateString('ja-JP');
  $('file').value='';$('consent').checked=false;setPhoto(d&&d.thumb||null);$('okRow').hidden=true;
  const slot=$('slot');slot.className='slot'+(d?' stamped':'')+(d&&d.thumb?' has-ph':'');$('big').className='big'+(d&&d.photo?' gold':'');
  $('stage').classList.remove('hit');$('miniOji').classList.remove('in');
  $('acts').style.display=d&&d.photo?'none':'flex';
  $('stampBtn').textContent=d?'金スタンプにする':'ポン！';$('stampBtn').classList.toggle('gold',!!d);
  $('camBtn').style.display='flex';
  $('shopLink').href=`/shop/${encodeURIComponent(slug)}/`;
  $('sheet').classList.add('open');$('sheet').setAttribute('aria-hidden','false');
}
function close(){$('sheet').classList.remove('open');$('sheet').setAttribute('aria-hidden','true')}
function thumbOf(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),m=360,r=Math.min(m/img.width,m/img.height,1);c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;img.src=URL.createObjectURL(file)})}
function doStamp(){
  if(!cur)return;const slug=cur[0],had=data.stamps[slug];
  if(had&&had.photo)return;
  if(had&&!pendingPhoto){$('file').click();return}
  const pref=prefOf(cur[3]);const firstPref=!!pref&&!Object.values(data.stamps).some(s=>s.pref===pref);
  const gold=!!pendingPhoto;
  data.stamps[slug]={t:had?.t||Date.now(),name:cur[1],pref,full:!!cur[5],type:cur[6]||'',photo:gold||!!had?.photo,thumb:pendingPhoto||had?.thumb||null,ok:$('consent').checked};
  if(!save())return;
  const slot=$('slot');slot.className='slot stamped hit'+(gold?' has-ph':'');$('big').className='big'+(gold?' gold':'');
  const stg=$('stage');stg.classList.remove('hit');void stg.offsetWidth;stg.classList.add('hit');
  stg.querySelectorAll('.ink').forEach(e=>e.remove());
  for(let i=0;i<14;i++){const e=document.createElement('i');e.className='ink';const a=Math.random()*6.283,r=110+Math.random()*60;e.style.cssText=`--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px;--s:${6+Math.random()*12}px;--c:${gold?'var(--gold)':'var(--royal)'}`;stg.appendChild(e)}
  const gain=(had?0:10)+(gold&&!had?.photo?20:0)+(firstPref&&!had?50:0);
  const pl=$('plus');pl.textContent='+'+gain+'pt';pl.className='plus'+(gold?' gold':'');void pl.offsetWidth;pl.classList.add('go');
  setTimeout(()=>$('miniOji').classList.add('in'),350);
  if(navigator.vibrate)navigator.vibrate([16,50,28]);
  $('acts').style.display=gold?'none':'flex';$('okRow').hidden=true;
  $('stampBtn').textContent='金スタンプにする';$('stampBtn').classList.add('gold');
  const oji=$('oji');oji.src=gold||firstPref?'/images/oji2/oji-excited.webp':'/images/oji2/oji-happy.webp';oji.classList.remove('jump');void oji.offsetWidth;oji.classList.add('jump');
  const bub=$('bubble');bub.textContent=gold?'金スタンプ！':firstPref?`${pref==='北海道'?pref:pref.replace(/[都府県]$/,'')}デビュー！`:'ナイス！';bub.style.animation='none';void bub.offsetWidth;bub.style.animation='';
  toast(gold?`✨ 金スタンプ +${gain}pt`:firstPref?`🗾 ${pref} はじめて！ +${gain}pt`:`✅ +${gain}pt`);
  if(gold||firstPref)setTimeout(confetti,300);
  render(slug,firstPref?pref:null);
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
function confetti(){if(reduce)return;const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const leaf=new Image();leaf.src='/images/menu2/leaf.webp';
  const P=Array.from({length:70},(_,i)=>({x:innerWidth/2,y:innerHeight*.5,vx:(Math.random()-.5)*13,vy:-Math.random()*15-5,s:i%5===0?26:7+Math.random()*7,c:['#C9223A','#D4A847','#6C9560','#E8C76F'][i%4],r:Math.random()*6,vr:(Math.random()-.5)*.3,lf:i%5===0}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);for(const p of P){p.vy+=.42;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);if(p.lf&&leaf.complete)x.drawImage(leaf,-p.s/2,-p.s/2,p.s,p.s);else{x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}x.restore()}if(++n<120)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
const loadImg=(src)=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
async function share(){
  const st=Object.values(data.stamps),pc={};for(const s of st)if(s.pref)pc[s.pref]=(pc[s.pref]||0)+1;
  const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');
  const[sky,wash,hills,oji,crown,cloud]=await Promise.all(['/images/scene/hero-sky.webp','/images/scene/page-wash-portrait.webp','/images/scene/hero-hills.webp','/images/oji2/oji-excited.webp','/images/brand/leaf-crown.png','/images/scene/hero-cloud1.webp'].map(loadImg));
  await document.fonts.ready;
  x.fillStyle='#FFF9EE';x.fillRect(0,0,1080,1920);if(wash)x.drawImage(wash,0,0,1080,1920);
  if(sky)x.drawImage(sky,0,0,1080,720);if(cloud){x.globalAlpha=.9;x.drawImage(cloud,-40,90,330,198);x.drawImage(cloud,640,40,240,144);x.globalAlpha=1}
  if(hills)x.drawImage(hills,-200,560,1480,171);
  if(oji)x.drawImage(oji,700,190,oji.width*(500/oji.height),500);
  x.textAlign='left';x.fillStyle='#C9223A';x.font='900 96px "Zen Maru Gothic"';x.fillText('王子スタンプ帳',60,170);
  x.fillStyle='#8A6D1F';x.font='900 34px "Zen Maru Gothic"';x.fillText('VEGAN STAMP BOOK',66,226);
  x.fillStyle='#FFFDF8';x.beginPath();x.roundRect(60,760,960,300,48);x.fill();
  x.textAlign='center';x.fillStyle='#C9223A';x.font='900 210px "Zen Maru Gothic"';x.fillText(st.length,300,960);
  x.fillStyle='#8A7458';x.font='900 40px "Zen Maru Gothic"';x.fillText('スタンプ',300,1020);
  x.fillStyle='#3F6A3A';x.font='900 210px "Zen Maru Gothic"';x.fillText(Object.keys(pc).length,760,960);
  x.fillStyle='#8A7458';x.font='900 40px "Zen Maru Gothic"';x.fillText('/ 47 都道府県',760,1020);
  const g=6,cw=50,ox=Math.round((1080-(13*cw+12*g))/2),oy=1080;
  for(const p of PREFS){const[cc,rr]=TILE[p];const n=pc[p]||0;x.fillStyle=n>=5?'#3F6A3A':n?'#6C9560':'#F6E4BD';x.beginPath();x.roundRect(ox+cc*(cw+g),oy+rr*(cw+g),cw,cw,12);x.fill()}
  x.fillStyle='#13213F';x.beginPath();x.roundRect(240,1770,600,92,46);x.fill();
  if(crown)x.drawImage(crown,262,1779,88,72);
  x.fillStyle='#fff';x.font='900 50px "Zen Maru Gothic"';x.fillText($('rankName').textContent,560,1833);
  x.fillStyle='#8A7458';x.font='700 38px "Noto Sans JP"';x.fillText('veganmapjapan.org · @veganoji',540,1905);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));const file=new File([blob],'oji-stamps.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:'#王子スタンプ帳 #日本ビーガンマップ'});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='oji-stamps.png';a.click();
}
$('q').addEventListener('input',search);
$('results').addEventListener('click',e=>{const b=e.target.closest('.res');if(b)open(b.dataset.slug)});
$('book').addEventListener('click',e=>{const b=e.target.closest('.st[data-slug]');if(b)open(b.dataset.slug)});
$('closeBtn').onclick=close;$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')close()});
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('stampBtn').onclick=doStamp;
$('slot').onclick=()=>{const d=cur&&data.stamps[cur[0]];if(!d||pendingPhoto)doStamp()};
$('shareBtn').onclick=()=>{tap($('shareBtn'));share()};
$('findBtn').onclick=()=>{tap($('findBtn'));$('q').focus();$('q').scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});const sb=document.querySelector('.search');sb.classList.remove('pulse');void sb.offsetWidth;sb.classList.add('pulse')};
function tap(b){b.classList.remove('tap');void b.offsetWidth;b.classList.add('tap')}
// quick genre chips
const CHIPS=[['ramen','ラーメン'],['curry','カレー'],['sweets','スイーツ'],['bakery','パン'],['teishoku','定食'],['burger','バーガー'],['sushi','寿司'],['leaf','完全ヴィーガン']];
$('chips').innerHTML=CHIPS.map(([k,l],i)=>`<button type="button" class="chip" style="--i:${i}" data-q="${l}"><img src="/images/menu2/${k}.webp" alt="">${l}</button>`).join('');
$('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const on=c.classList.contains('on');document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));$('q').value=on?'':c.dataset.q;if(!on)c.classList.add('on');search()});
$('q').addEventListener('input',()=>document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.q===$('q').value.trim())));
// sections pop in on scroll; tiles/badges animate once, then settle
const io='IntersectionObserver' in window&&!reduce?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);setTimeout(()=>e.target.querySelectorAll('.jp,.badges').forEach(x=>x.classList.add('settled')),2400)}}),{threshold:.2}):null;
document.querySelectorAll('.sec').forEach(s=>{if(io)io.observe(s);else{s.classList.add('in');s.querySelectorAll('.jp,.badges').forEach(x=>x.classList.add('settled'))}});
// 王子: idle wink + tap reaction
const OJI_LINES=['どこ行く？','おなかすいた！','ビーガン最高！','つぎは何食べる？','スタンプ集めよ！'];
const wink=new Image();wink.src='/images/oji2/oji-winking.webp';
if(!reduce)setInterval(()=>{const o=$('oji');if(o.classList.contains('jump'))return;const base=o.src;o.src=wink.src;setTimeout(()=>{if(o.src===wink.src)o.src=base},420)},6500);
$('oji').onclick=()=>{const o=$('oji');o.classList.remove('tilt','jump');void o.offsetWidth;o.classList.add('tilt');const b=$('bubble');b.textContent=OJI_LINES[Math.floor(Math.random()*OJI_LINES.length)];b.style.animation='none';void b.offsetWidth;b.style.animation=''};
$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{setPhoto(await thumbOf(f))}catch(e){toast('写真を読み込めませんでした')}};
render();
fetch('/data/search.json').then(r=>r.json()).then(d=>{shops=d.shops||[];for(const s of shops)bySlug.set(s[0],s);search();const p=new URLSearchParams(location.search).get('shop');if(p)open(p)}).catch(()=>toast('お店データを読み込めませんでした'));
</script>
